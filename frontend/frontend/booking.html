<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>EventSphere — Reserve Your Tickets</title>

  <link
          rel="preconnect"
          href="https://fonts.googleapis.com"
  >

  <link
          href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet"
  >

  <style>

    :root {
      --ink: #0a0a0a;
      --paper: #ffffff;
      --paper-dim: #f4f4f2;
      --grey: #6f6f6f;
      --grey-light: #d8d8d5;
      --radius: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background: var(--paper-dim);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 5vw;
      background: var(--paper);
      border-bottom: 2px solid var(--ink);
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo .dot {
      width: 10px;
      height: 10px;
      background: var(--ink);
      border-radius: 50%;
    }

    .back-link {
      font-size: .88rem;
      font-family: 'Space Mono', monospace;
      color: var(--grey);
    }

    .back-link:hover {
      color: var(--ink);
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 50px 5vw 90px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 40px;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .72rem;
      color: var(--grey);
      margin-bottom: 10px;
    }

    /* =========================
       EVENT DETAILS
       ========================= */

    .event-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 34px;
      margin-bottom: 26px;
    }

    .event-card h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.7rem;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 18px;
    }

    .event-meta .item {
      font-size: .88rem;
    }

    .event-meta .item .k {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--grey);
      margin-bottom: 4px;
    }

    .event-desc {
      color: var(--grey);
      font-size: .92rem;
      line-height: 1.6;
      border-top: 1px solid var(--grey-light);
      padding-top: 18px;
    }

    .ev-cat-badge {
      font-family: 'Space Mono', monospace;
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      border: 1px solid var(--ink);
      padding: 5px 8px;
      display: inline-block;
      margin-bottom: 15px;
    }

    /* =========================
       BOOKING CARD
       ========================= */

    .booking-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 30px;
    }

    .booking-card h2 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 22px;
    }

    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--grey-light);
      padding: 14px;
      margin-bottom: 20px;
    }

    .ticket-label {
      font-size: .9rem;
      font-weight: 600;
    }

    .ticket-label small {
      display: block;
      color: var(--grey);
      font-size: .75rem;
      margin-top: 4px;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stepper button {
      width: 34px;
      height: 34px;
      border: 2px solid var(--ink);
      background: var(--paper);
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stepper button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .stepper button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .stepper span {
      min-width: 25px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
    }

    /* =========================
       PRICE
       ========================= */

    .price-breakdown {
      border-top: 1px dashed var(--grey-light);
      padding-top: 18px;
      margin-top: 8px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      margin-bottom: 10px;
      color: var(--grey);
    }

    .price-row.total {
      color: var(--ink);
      font-weight: 700;
      font-size: 1.15rem;
      border-top: 2px solid var(--ink);
      padding-top: 14px;
      margin-top: 8px;
    }

    .price-row .val {
      font-family: 'Space Mono', monospace;
    }

    /* =========================
       CHECKOUT BUTTON
       ========================= */

    .btn-checkout {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition:
              transform .15s ease,
              opacity .2s ease;
    }

    .btn-checkout:hover {
      transform: translateY(-2px);
    }

    .btn-checkout:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .auth-note {
      font-size: .82rem;
      color: var(--grey);
      margin-top: 14px;
      text-align: center;
    }

    .auth-note a {
      font-weight: 700;
      text-decoration: underline;
    }

    /* =========================
       ALERT
       ========================= */

    .alert {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: .85rem;
      margin-bottom: 18px;
      display: none;
      border: 2px solid var(--ink);
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: var(--paper-dim);
    }

    .alert.success {
      background: var(--ink);
      color: var(--paper);
    }

    /* =========================
       CONFIRMATION
       ========================= */

    .confirm-card {
      display: none;
      text-align: center;
      padding: 20px 6px;
    }

    .confirm-card .ref {
      font-family: 'Space Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      border: 2px dashed var(--ink);
      border-radius: var(--radius);
      padding: 18px;
      margin: 18px 0;
      letter-spacing: .05em;
    }

    .confirm-card p {
      color: var(--grey);
      font-size: .9rem;
      margin-bottom: 6px;
    }

    .confirmation-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .confirmation-actions a {
      display: block;
      padding: 12px;
      border: 2px solid var(--ink);
      font-weight: 700;
    }

    .confirmation-actions a.primary {
      background: var(--ink);
      color: var(--paper);
    }

    /* =========================
       LOADING / ERROR
       ========================= */

    .loading-state,
    .error-state {
      padding: 80px 20px;
      text-align: center;
      color: var(--grey);
      font-family: 'Space Mono', monospace;
      font-size: .9rem;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 820px) {

      .wrap {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {

      header {
        padding: 18px 20px;
      }

      .wrap {
        padding: 30px 20px 60px;
      }

      .event-card,
      .booking-card {
        padding: 22px;
      }

      .event-card h1 {
        font-size: 1.4rem;
      }

      .ticket-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

    }

  </style>

<link rel="stylesheet" href="shared.css">
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="es-header">
  <div class="logo"><span class="dot"></span>EventSphere</div>
  <nav>
    <a class="nav-link" href="index.html#events">Events</a>
    <a class="nav-link" href="index.html#how">How it works</a>
    <a class="btn ghost" id="userNavBtn" href="user-management.html" style="display:none;">User</a>
    <a class="btn ghost" id="myBookingsNavBtn" href="my-bookings.html" style="display:none;">My Bookings</a>
    <a class="btn ghost" id="loginNavBtn" href="login.html">Login</a>
  </nav>
</header>


<!-- =========================================================
     PAGE BODY
     ========================================================= -->

<div id="pageBody">

  <div
          class="loading-state"
          id="pageLoading"
  >
    Loading event details…
  </div>

</div>


<script>

  // =========================================================
  // CONFIG
  // =========================================================

  const API_BASE_URL =
          window.EVENTSPHERE_API_BASE_URL ||
          (window.location.protocol === 'file:' ? 'http://localhost:8080/api' : '/api');


  // =========================================================
  // URL PARAMETERS
  // =========================================================

  const params =
          new URLSearchParams(
                  window.location.search
          );


  const eventId =
          params.get('eventId');


  // =========================================================
  // STATE
  // =========================================================

  let currentEvent = null;

  let ticketCount = 1;


  const pageBody =
          document.getElementById(
                  'pageBody'
          );


  // =========================================================
  // INITIALIZE
  // =========================================================

  async function init() {

    if (!eventId) {

      renderError(
              'No event was specified. Please go back and pick an event to book.'
      );

      return;
    }


    try {

      const res =
              await fetch(
                      `${API_BASE_URL}/events/${encodeURIComponent(eventId)}`
              );


      const json =
              await res
                      .json()
                      .catch(
                              () => ({})
                      );


      if (
              !res.ok ||
              json.success === false
      ) {

        throw new Error(
                json.message ||
                'Event not found'
        );
      }


      currentEvent =
              json.data ?? json;


      if (!currentEvent) {

        throw new Error(
                'Event details could not be loaded'
        );
      }


      renderBookingPage();


    } catch (err) {

      renderError(
              err.message ||
              'Unable to load event'
      );

    }

  }


  // =========================================================
  // ERROR PAGE
  // =========================================================

  function renderError(message) {

    pageBody.innerHTML = `

      <div class="error-state">

        ${escapeHtml(message)}

        <br>
        <br>

        <a
          href="index.html"
          style="
            text-decoration:underline;
            font-weight:700;
          "
        >
          ← Back to all events
        </a>

      </div>

    `;

  }


  // =========================================================
  // RENDER BOOKING PAGE
  // =========================================================

  function renderBookingPage() {

    const ev =
            currentEvent;


    const dateStr =
            formatDate(
                    ev.eventDate
            );


    const timeStr =
            formatTime(
                    ev.eventTime
            );


    const availableSeats =
            Number(
                    ev.availableSeats ?? 0
            );


    const maxTickets =
            Math.min(
                    availableSeats,
                    10
            );


    const isLoggedIn =
            !!localStorage.getItem(
                    'es_token'
            );


    const price =
            Number(
                    ev.price ?? 0
            );


    pageBody.innerHTML = `

      <main class="wrap">

        <!-- ============================================
             EVENT DETAILS
             ============================================ -->

        <section>

          <div class="eyebrow">
            Event details
          </div>


          <article class="event-card">

            ${
            ev.category
                    ? `
                  <div class="ev-cat-badge">
                    ${escapeHtml(
                            ev.category
                    )}
                  </div>
                `
                    : ''
    }


            <h1>
              ${escapeHtml(
            ev.title
    )}
            </h1>


            <div class="event-meta">

              <div class="item">

                <span class="k">
                  Date
                </span>

                ${escapeHtml(
            dateStr
    )}

              </div>


              <div class="item">

                <span class="k">
                  Time
                </span>

                ${escapeHtml(
            timeStr
    )}

              </div>


              <div class="item">

                <span class="k">
                  Venue
                </span>

                ${escapeHtml(
            ev.venue
    )}

              </div>


              <div class="item">

                <span class="k">
                  Available
                </span>

                ${availableSeats}
                ticket(s)

              </div>

            </div>


            <div class="event-desc">

              ${
            escapeHtml(
                    ev.description ||
                    'Join us for this exciting EventSphere event.'
            )
    }

            </div>

          </article>

        </section>


        <!-- ============================================
             BOOKING
             ============================================ -->

        <section>

          <div
            class="eyebrow"
          >
            Reserve your tickets
          </div>


          <div class="booking-card">


            <!-- ALERT -->

            <div
              id="alertBox"
              class="alert"
            ></div>


            <!-- BOOKING FORM -->

            <div
              id="bookingFormArea"
            >

              <h2>
                Ticket selection
              </h2>


              ${
            maxTickets >= 1

                    ? `

                  <div
                    class="ticket-row"
                  >

                    <div
                      class="ticket-label"
                    >

                      Standard ticket

                      <small>
                        $${price.toFixed(2)}
                        each
                      </small>

                    </div>


                    <div
                      class="stepper"
                    >

                      <button
                        type="button"
                        id="decrBtn"
                        aria-label="Decrease tickets"
                      >
                        −
                      </button>


                      <span
                        id="ticketCountDisplay"
                      >
                        1
                      </span>


                      <button
                        type="button"
                        id="incrBtn"
                        aria-label="Increase tickets"
                      >
                        +
                      </button>

                    </div>

                  </div>


                  <div
                    class="price-breakdown"
                  >

                    <div
                      class="price-row"
                    >

                      <span>
                        Ticket price
                      </span>

                      <span
                        class="val"
                      >
                        $${price.toFixed(2)}
                      </span>

                    </div>


                    <div
                      class="price-row"
                    >

                      <span>
                        Tickets
                      </span>

                      <span
                        class="val"
                        id="countRow"
                      >
                        1
                      </span>

                    </div>


                    <div
                      class="price-row total"
                    >

                      <span>
                        Total
                      </span>

                      <span
                        class="val"
                        id="totalPrice"
                      >
                        $${price.toFixed(2)}
                      </span>

                    </div>

                  </div>


                  <button
                    type="button"
                    class="btn-checkout"
                    id="checkoutBtn"
                  >
                    ${
                            isLoggedIn
                                    ? 'Confirm & checkout'
                                    : 'Login to book'
                    }
                  </button>


                  ${
                            isLoggedIn
                                    ? `
                        <p class="auth-note">
                          Your booking confirmation will be sent
                          to your registered email address.
                        </p>
                      `
                                    : `
                        <p class="auth-note">
                          You need to
                          <a href="login.html">
                            log in
                          </a>
                          before booking.
                        </p>
                      `
                    }

                `

                    : `

                  <div
                    class="alert show error"
                  >
                    Sorry, this event is sold out.
                  </div>

                  <a
                    href="index.html"
                    class="btn-checkout"
                    style="
                      display:block;
                      text-align:center;
                    "
                  >
                    Browse other events
                  </a>

                `

    }

            </div>


            <!-- ========================================
                 CONFIRMATION
                 ======================================== -->

            <div
              class="confirm-card"
              id="confirmCard"
            >

              <div class="eyebrow">
                Booking confirmed
              </div>


              <h2>
                You're going!
              </h2>


              <p>
                Your booking has been successfully confirmed.
              </p>


              <div
                class="ref"
                id="confirmRef"
              >
              </div>


              <p
                id="confirmSummary"
              >
              </p>


              <p>
                Please keep your booking reference
                for future reference.
              </p>


              <div
                class="confirmation-actions"
              >

                <a
                  href="index.html"
                  class="primary"
                >
                  Back to events
                </a>


                <a
                  href="my-bookings.html"
                >
                  View my bookings
                </a>

              </div>

            </div>

          </div>

        </section>

      </main>

    `;


    if (maxTickets >= 1) {

      wireStepperAndCheckout(
              maxTickets,
              isLoggedIn
      );

    }

  }


  // =========================================================
  // TICKET STEPPER + CHECKOUT
  // =========================================================

  function wireStepperAndCheckout(
          maxTickets,
          isLoggedIn
  ) {

    const decrBtn =
            document.getElementById(
                    'decrBtn'
            );


    const incrBtn =
            document.getElementById(
                    'incrBtn'
            );


    const countDisplay =
            document.getElementById(
                    'ticketCountDisplay'
            );


    const countRow =
            document.getElementById(
                    'countRow'
            );


    const totalPriceEl =
            document.getElementById(
                    'totalPrice'
            );


    const checkoutBtn =
            document.getElementById(
                    'checkoutBtn'
            );


    ticketCount = 1;


    function updateUI() {

      countDisplay.textContent =
              ticketCount;


      countRow.textContent =
              ticketCount;


      const total =
              (
                      Number(
                              currentEvent.price
                      ) *
                      ticketCount
              ).toFixed(2);


      totalPriceEl.textContent =
              `$${total}`;


      decrBtn.disabled =
              ticketCount <= 1;


      incrBtn.disabled =
              ticketCount >= maxTickets;

    }


    decrBtn.addEventListener(
            'click',
            () => {

              if (
                      ticketCount > 1
              ) {

                ticketCount--;

                updateUI();

              }

            }
    );


    incrBtn.addEventListener(
            'click',
            () => {

              if (
                      ticketCount <
                      maxTickets
              ) {

                ticketCount++;

                updateUI();

              }

            }
    );


    checkoutBtn.addEventListener(
            'click',
            async () => {

              if (!isLoggedIn) {

                window.location.href =
                        `login.html?redirect=${
                                encodeURIComponent(
                                        window.location.pathname +
                                        window.location.search
                                )
                        }`;

                return;
              }


              await submitBooking(
                      checkoutBtn
              );

            }
    );


    updateUI();

  }


  // =========================================================
  // SUBMIT BOOKING
  // =========================================================

  async function submitBooking(btn) {

    hideAlert();


    btn.disabled = true;

    btn.textContent =
            'Confirming…';


    const token =
            localStorage.getItem(
                    'es_token'
            );


    if (!token) {

      showAlert(
              'Your login session has expired. Please log in again.'
      );

      btn.disabled = false;

      btn.textContent =
              'Confirm & checkout';

      return;

    }


    try {

      const res =
              await fetch(
                      `${API_BASE_URL}/bookings`,
                      {
                        method: 'POST',

                        headers: {

                          'Content-Type':
                                  'application/json',

                          'Authorization':
                                  `Bearer ${token}`

                        },

                        body:
                                JSON.stringify({

                                  eventId:
                                          Number(eventId),

                                  ticketCount:
                                  ticketCount

                                })

                      }
              );


      const json =
              await res
                      .json()
                      .catch(
                              () => ({})
                      );


      if (
              !res.ok ||
              json.success === false
      ) {

        throw new Error(
                json.message ||
                'Booking failed'
        );

      }


      const booking =
              json.data ?? json;


      showConfirmation(
              booking
      );


    } catch (err) {

      showAlert(
              err.message ||
              'Booking failed. Please try again.'
      );


      btn.disabled = false;

      btn.textContent =
              'Confirm & checkout';

    }

  }


  // =========================================================
  // SHOW CONFIRMATION
  // =========================================================

  function showConfirmation(
          booking
  ) {

    document.getElementById(
            'bookingFormArea'
    ).style.display =
            'none';


    const confirmCard =
            document.getElementById(
                    'confirmCard'
            );


    confirmCard.style.display =
            'block';


    document.getElementById(
            'confirmRef'
    ).textContent =
            booking.bookingReference ||
            booking.reference ||
            'CONFIRMED';


    document.getElementById(
            'confirmSummary'
    ).textContent =
            `${booking.ticketCount ?? ticketCount} ticket(s) for ${
                    booking.eventTitle ||
                    currentEvent.title
            } — total $${
                    Number(
                            booking.totalPrice ??
                            (
                                    Number(
                                            currentEvent.price
                                    ) *
                                    ticketCount
                            )
                    ).toFixed(2)
            }`;

  }


  // =========================================================
  // ALERT
  // =========================================================

  function showAlert(
          message,
          type = 'error'
  ) {

    const box =
            document.getElementById(
                    'alertBox'
            );


    if (!box) {
      return;
    }


    box.textContent =
            message;


    box.className =
            `alert show ${type}`;

  }


  function hideAlert() {

    const box =
            document.getElementById(
                    'alertBox'
            );


    if (box) {

      box.className =
              'alert';

    }

  }


  // =========================================================
  // DATE FORMAT
  // =========================================================

  function formatDate(
          isoDate
  ) {

    if (!isoDate) {
      return '';
    }


    const d =
            new Date(
                    isoDate +
                    'T00:00:00'
            );


    return d.toLocaleDateString(
            undefined,
            {
              weekday: 'long',
              month: 'short',
              day: 'numeric',
              year: 'numeric'
            }
    );

  }


  // =========================================================
  // TIME FORMAT
  // =========================================================

  function formatTime(
          isoTime
  ) {

    if (!isoTime) {
      return '';
    }


    const [
      h,
      m
    ] =
            isoTime.split(':');


    const d =
            new Date();


    d.setHours(
            Number(h),
            Number(m)
    );


    return d.toLocaleTimeString(
            undefined,
            {
              hour: 'numeric',
              minute: '2-digit'
            }
    );

  }


  // =========================================================
  // HTML ESCAPE
  // =========================================================

  function escapeHtml(
          str
  ) {

    const div =
            document.createElement(
                    'div'
            );


    div.textContent =
            str ?? '';


    return div.innerHTML;

  }


  // =========================================================
