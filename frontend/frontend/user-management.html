<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventSphere — User Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#fff;--paper-dim:#f4f4f2;--line:#1f1f1f;--grey:#6f6f6f;--grey-light:#d8d8d5;--danger:#b42318;--danger-bg:#fef3f2;--success:#027a48;--success-bg:#ecfdf3}
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button,input,select{font:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 5vw;background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{font-family:'Archivo Black',sans-serif;font-size:1.35rem;display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;background:var(--ink);border-radius:50%;display:inline-block}
nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.nav-link{font-size:.9rem;font-weight:500;padding:8px 4px}.btn{font-weight:600;font-size:.82rem;padding:9px 14px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}.btn.secondary{background:var(--paper);color:var(--ink)}.btn.danger{background:var(--danger);border-color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding:50px 5vw 80px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}.top h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.8rem,4vw,2.7rem)}.muted{color:var(--grey);line-height:1.5}.card{border:2px solid var(--ink);padding:24px;background:var(--paper)}.status{display:none;margin-bottom:20px;padding:12px 16px;border:2px solid var(--success);background:var(--success-bg);color:var(--success)}.status.show{display:block}.status.error{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.table-wrap{overflow-x:auto;border:2px solid var(--ink)}table{width:100%;border-collapse:collapse;min-width:850px}thead{background:var(--ink);color:var(--paper)}th{text-align:left;padding:13px 15px;font-family:'Space Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:400}td{padding:14px 15px;border-top:1px solid var(--grey-light);vertical-align:middle;font-size:.9rem}tbody tr:hover{background:var(--paper-dim)}td input,td select{width:100%;padding:8px 9px;border:2px solid var(--ink);background:var(--paper);min-width:130px}td input+input{margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:.74rem;color:var(--grey)}
@media(max-width:800px){header{align-items:flex-start;flex-direction:column;gap:14px}nav{width:100%}main{padding:35px 4vw}}
</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="es-header">
  <div class="logo"><span class="dot"></span>EventSphere</div>
  <nav>
    <a class="nav-link" href="index.html#events">Events</a>
    <a class="nav-link" href="index.html#how">How it works</a>
    <a class="btn ghost" id="userNavBtn" href="user-management.html" style="display:none;">User</a>
    <a class="btn ghost" id="myBookingsNavBtn" href="my-bookings.html" style="display:none;">My Bookings</a>
    <a class="btn ghost" id="loginNavBtn" href="login.html">Login</a>
  </nav>
</header>
<main>
  <div class="top">
    <div><h1>User Management</h1><p class="muted">Update user details and roles, or delete users. Your own admin account cannot be deleted.</p></div>
  </div>
  <div id="status" class="status"></div>
  <section class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>User</th><th>Contact</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"><tr><td colspan="5">Loading users…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const API=window.EVENTSPHERE_API_BASE_URL||(window.location.protocol === 'file:' ? 'http://localhost:8080/api' : '/api');
const token=localStorage.getItem('es_token');
const role=localStorage.getItem('es_user_role');
const currentUserId=localStorage.getItem('es_user_id');
const statusEl=document.getElementById('status');
const body=document.getElementById('usersBody');

if(!token||role!=='ADMIN'){
  document.body.innerHTML='<main><section class="card"><h1>Admin access required</h1><p class="muted">Please log in with an administrator account.</p><br><a class="btn" href="login.html">Go to Login</a></section></main>';
  throw new Error('Not an admin');
}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function setStatus(message,error=false){statusEl.textContent=message;statusEl.className='status show'+(error?' error':'')}
function headers(bodyPresent=false){return {Authorization:'Bearer '+token,...(bodyPresent?{'Content-Type':'application/json'}:{})}}
async function api(url,options={}){
  const res=await fetch(API+url,{...options,headers:{...headers(options.body!==undefined),...(options.headers||{})}});
  if(res.status===204)return null;
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.success===false)throw new Error(data.message||data.error||`Request failed (${res.status})`);
  return data.data??data;
}
async function loadUsers(){
  try{
    const users=await api('/users');
    body.innerHTML=users.map(u=>`
      <tr>
        <td><input id="name-${u.id}" value="${escapeHtml(u.fullName)}"><div class="small">ID: ${u.id}</div></td>
        <td><input id="email-${u.id}" value="${escapeHtml(u.email)}" placeholder="Email"><input id="phone-${u.id}" value="${escapeHtml(u.phone||'')}" placeholder="Phone"></td>
        <td><select id="role-${u.id}"><option value="USER" ${u.role==='USER'?'selected':''}>USER</option><option value="ADMIN" ${u.role==='ADMIN'?'selected':''}>ADMIN</option></select></td>
        <td>${u.createdAt?new Date(u.createdAt).toLocaleString():''}</td>
        <td><div class="actions"><button class="btn secondary" onclick="updateUser(${u.id})">Update</button><button class="btn danger" onclick="deleteUser(${u.id})" ${String(u.id)===String(currentUserId)?'disabled':''}>Delete</button></div></td>
      </tr>`).join('')||'<tr><td colspan="5">No users found.</td></tr>';
  }catch(e){setStatus(e.message,true)}
}
async function updateUser(id){
  const fullName=document.getElementById('name-'+id).value.trim();
  const email=document.getElementById('email-'+id).value.trim();
  const phone=document.getElementById('phone-'+id).value.trim();
  const role=document.getElementById('role-'+id).value;
  if(!fullName||!email){setStatus('Full name and email are required.',true);return}
  try{await api('/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({fullName,email,phone,role})});setStatus('User updated successfully.');await loadUsers()}catch(e){setStatus(e.message,true)}
}
async function deleteUser(id){
  if(!confirm('Delete this user? This cannot be undone.'))return;
  try{await api('/users/'+encodeURIComponent(id),{method:'DELETE'});setStatus('User deleted successfully.');await loadUsers()}catch(e){setStatus(e.message,true)}
}
window.updateUser=updateUser;window.deleteUser=deleteUser;

loadUsers();
</script>
<script src="shared.js"></script>
</body>
</html>
